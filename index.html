<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>meteorshower</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'%3E%3Cstyle%3Epath%7Bfill:%23333333%7D@media (prefers-color-scheme:dark)%7Bpath%7Bfill:%23EBEBEB%7D%7D%3C/style%3E%3Cpath d='M88 289.6L64.4 360.2L64.4 160C64.4 124.7 93.1 96 128.4 96L267.1 96C280.9 96 294.4 100.5 305.5 108.8L343.9 137.6C349.4 141.8 356.2 144 363.1 144L480.4 144C515.7 144 544.4 172.7 544.4 208L544.4 224L179 224C137.7 224 101 250.4 87.9 289.6zM509.8 512L131 512C98.2 512 75.1 479.9 85.5 448.8L133.5 304.8C140 285.2 158.4 272 179 272L557.8 272C590.6 272 613.7 304.1 603.3 335.2L555.3 479.2C548.8 498.8 530.4 512 509.8 512z'/%3E%3C/svg%3E">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrap">
  <main id="lobby" class="lobby-container">
    <h2 class="lobby-title">meteorshower</h2>
    <div class="auth-group">
      <input type="text" id="name" placeholder="id" class="auth-input">
      <div class="auth-row">
        <input type="password" id="pw" placeholder="passcode" class="auth-input flex-1">
        <button id="enter" class="btn-primary">confirm</button>
      </div>
    </div>
    <div id="msg" class="small msg-text"></div>
  </main>

  <section id="app" class="app-container hide">
    <span id="myName" class="hide"></span>
    <button id="out" class="btn-esc">esc</button>

    <div class="grid">
      <article class="card">
        <div id="vid"><div id="yt"></div></div>
        
        <header class="player-top">
          <div class="cover-img"></div>
          <div class="info-area">
            <div id="now">empty queue</div>
            <textarea id="memo" placeholder="no memo" readonly></textarea>
          </div>
        </header>

        <div class="seek-wrap">
          <input type="range" id="seek" min="0" value="0" step="1">
          <span id="time" class="small">0:00</span>
        </div>

        <nav class="controls">
          <button id="prev" class="ctrl-btn adm">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="pp" class="ctrl-btn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="next" class="ctrl-btn adm">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button id="loop" class="ctrl-btn adm">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          </button>

          <div class="vol-group adm">
            <button class="ctrl-btn"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
            <input type="range" id="mvol" min="0" max="100" value="100">
          </div>

          <div class="vol-group">
            <button class="ctrl-btn"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></button>
            <input type="range" id="vol" min="0" max="100" value="100">
          </div>
        </nav>

        <div class="adm q-container">
          <h3 class="q-title">queue</h3>
          <ul id="queue" class="list"></ul>
        </div>
      </article>

      <aside class="card adm">
        <nav class="row tab-header">
          <button data-tab="pl" class="on flex-1">playlist</button>
          <button data-tab="u" id="utab" class="flex-1">users</button>
        </nav>
        
        <div class="tab-content-wrap">
          <div id="tpl" class="tab tab-pane">
            <div class="row">
              <select id="plSel" class="flex-1"></select>
              <button id="plNew">add new list</button>
            </div>
            <div class="row">
              <button id="plRen" class="flex-1">edit</button>
              <button id="plDel" class="flex-1">delete</button>
              <button id="plAll" class="flex-1 btn-primary">add all to queue</button>
            </div>
            <div class="row pl-add-row">
              <input type="text" id="plUrl" placeholder="paste link" class="flex-1 pl-url-input">
              <button id="qAddDirect">to queue</button>
              <button id="plAdd">to list</button>
            </div>
            <ul id="pl" class="list"></ul>
          </div>

          <div id="tu" class="tab hide tab-pane">
            <ul id="users" class="list"></ul>
          </div>
        </div>
      </aside>
    </div>
  </section>
</div>

<div id="modal-backdrop" class="modal-backdrop hide" tabindex="-1">
  <div class="modal-box">
    <h3 id="modal-title" class="modal-title"></h3>
    <input type="text" id="modal-input" class="modal-input" autocomplete="off">
    <div class="modal-btns">
      <button id="modal-cancel" class="btn-cancel">cancel</button>
      <button id="modal-confirm" class="btn-primary">confirm</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
